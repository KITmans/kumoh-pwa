<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0c">
<title>강의실 사용 현황 조회</title>
<script>
  // 저장된 테마(없으면 기기 설정)를 화면이 그려지기 전에 적용해서 깜빡임을 막는다.
  (function(){
    var t = null;
    try { t = localStorage.getItem('kit-theme'); } catch(e){}
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#f5f5f7' : '#0b0b0c');
  })();
</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  :root{
    --navy:#000000;
    --navy-2:#1c1c1e;
    --paper:#0b0b0c;
    --paper-2:#1a1a1c;
    --line:#2c2c2e;
    --amber:#d99b3f;
    --amber-dim:#8a7148;
    --free:#4fbf8b;
    --free-bg:#12241d;
    --busy:#e2685c;
    --busy-bg:#2a1917;
    --ink:#f5f5f4;
    --ink-dim:#9a9a9d;
    --radius:2px;
    --tabbar-h:60px;
    --tabbar-bg:#141416;
    --ink-strong:#ffffff;
    --clock-dim:#a9a9ac;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --navy:#ffffff;
    --navy-2:#f2f2f4;
    --paper:#f5f5f7;
    --paper-2:#ffffff;
    --line:#dcdce0;
    --amber:#b86f0a;
    --amber-dim:#e3c48e;
    --free:#1f8a5b;
    --free-bg:#e3f4ec;
    --busy:#c8392d;
    --busy-bg:#fbe9e7;
    --ink:#1c1c1e;
    --ink-dim:#6b6b70;
    --tabbar-bg:#ffffff;
    --ink-strong:#000000;
    --clock-dim:#6b6b70;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 12px);}

  header.top{
    background:var(--navy);
    color:var(--ink);
    padding:18px 20px 18px;
    border-bottom:3px solid var(--amber);
    position:sticky;
    top:0;
    z-index:5;
  }
  header.top{position:sticky;}
  .weather{
    position:absolute;
    top:16px;right:16px;
    display:flex;align-items:center;gap:5px;
    background:var(--navy-2);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink-dim);
  }
  .weather .w-icon{font-size:16px;line-height:1;}
  .weather .w-temp{color:var(--ink);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;}
  .refresh-btn{
    border:1px solid var(--line);background:var(--paper-2);color:var(--ink-dim);
    padding:4px 10px;font-size:11px;border-radius:var(--radius);cursor:pointer;font-family:inherit;
  }
  .bus-stop{border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;}
  .bus-stop .bs-title{font-size:15px;font-weight:700;margin:0 0 2px;}
  .bus-stop .bs-sub{font-size:11px;color:var(--ink-dim);margin:0 0 10px;}
  .bus-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px dashed var(--line);}
  .bus-row .br-no{font-size:16px;font-weight:700;color:var(--amber);min-width:64px;}
  .bus-row .br-info{flex:1;font-size:11px;color:var(--ink-dim);padding:0 8px;}
  .bus-row .br-eta{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;}
  .bus-row .br-eta.soon{color:var(--busy);}
  .load-more{
    width:100%;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);
    padding:12px;font-size:13px;border-radius:var(--radius);cursor:pointer;font-family:inherit;margin-top:4px;
  }
  .n-pin{color:var(--amber);font-size:11px;font-weight:700;margin-right:6px;}
  header.top .kicker{
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--amber);
    margin:0 0 8px;
  }
  header.top h1{
    font-weight:700;
    font-size:20px;
    margin:0 0 10px;
    line-height:1.3;
  }
  .clock-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:13px;
    color:var(--clock-dim);
  }
  .clock-row b{
    color:var(--ink-strong);
    font-size:15px;
    font-variant-numeric: tabular-nums;
  }

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  section{padding:20px;border-bottom:1px solid var(--line);}
  section:last-child{border-bottom:none;}
  section h2{
    font-size:12px;
    letter-spacing:.04em;
    color:var(--ink-dim);
    margin:0 0 12px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .picker-row{display:flex;gap:8px;}
  select{
    flex:1;
    width:100%;
    border:1px solid var(--line);
    background-color:var(--paper-2);
    padding:12px 10px;
    font-size:15px;
    border-radius:var(--radius);
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 13px) calc(50% - 3px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select option{background:var(--paper-2);color:var(--ink);}
  select:disabled{color:var(--ink-dim);background-color:var(--paper-2);}
  select:focus{outline:2px solid var(--amber);outline-offset:-1px;}

  input[type=text]{
    width:100%;
    border:1px solid var(--line);
    background-color:var(--paper-2);
    padding:12px 12px;
    font-size:15px;
    border-radius:var(--radius);
    color:var(--ink);
    font-family:inherit;
  }
  input[type=text]::placeholder{color:var(--ink-dim);}
  input[type=text]:focus{outline:2px solid var(--amber);outline-offset:-1px;}

  .status-card{
    border:1px solid var(--line);
    background:var(--paper-2);
    padding:18px;
    border-radius:var(--radius);
  }
  .status-card .room-name{
    font-weight:700;
    font-size:20px;
    margin:0 0 2px;
  }
  .status-card .room-sub{
    font-size:12px;
    color:var(--ink-dim);
    margin:0 0 14px;
  }
  .badge{
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .badge.free{background:var(--free-bg);color:var(--free);}
  .badge.busy{background:var(--busy-bg);color:var(--busy);}

  .class-row{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .class-row .cname{font-size:16px;font-weight:600;margin:0 0 4px;}
  .class-row .cmeta{font-size:13px;color:var(--ink-dim);}

  .placeholder{
    font-size:13px;
    color:var(--ink-dim);
    text-align:center;
    padding:20px 0;
  }

  .time-row{display:flex;gap:8px;}
  .go-btn{
    margin-top:10px;
    width:100%;
    border:1px solid var(--amber);
    background:var(--amber);
    color:#1a1204;
    padding:11px;
    font-size:14px;
    font-weight:700;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .go-btn:active{background:var(--amber-dim);}

  .free-picker{margin-bottom:12px;}
  .free-list{display:flex;flex-direction:column;gap:6px;}
  .free-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border:1px solid var(--line);
    background:var(--paper-2);
    padding:9px 12px;
    border-radius:var(--radius);
    font-size:14px;
    cursor:pointer;
  }
  .free-item .fr-room{font-weight:600;}
  .free-item .fr-tag{font-size:11px;color:var(--free);}
  .count-line{font-size:12px;color:var(--ink-dim);margin-bottom:8px;}

  .mt-toolbar{display:flex;gap:6px;margin-bottom:10px;}
  .mt-tool-btn{
    flex:1;
    border:1px solid var(--line);
    background:var(--paper-2);
    color:var(--ink-dim);
    padding:8px 0;
    font-size:12px;
    font-weight:600;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .mt-tool-btn.active{border-color:var(--amber);color:var(--amber);}
  .mt-grid-wrap{overflow-x:auto;margin-bottom:14px;}
  .mt-grid-wrap.collapsed{display:none;}
  table.mt-grid{
    border-collapse:collapse;
    width:100%;
    min-width:340px;
    font-size:11px;
  }
  table.mt-grid th, table.mt-grid td{
    border:1px solid var(--line);
    text-align:center;
    padding:0;
  }
  table.mt-grid th{
    color:var(--ink-dim);
    font-weight:600;
    padding:5px 2px;
    font-size:10px;
  }
  table.mt-grid td.mt-pcol{
    color:var(--ink-dim);
    font-size:10px;
    width:22px;
    padding:3px 0;
  }
  table.mt-grid td.mt-cell{height:26px;width:44px;cursor:default;}
  table.mt-grid td.mt-cell.filled{
    cursor:pointer;color:#fff;height:36px;padding:2px 1px;
    display:table-cell;vertical-align:middle;
  }
  table.mt-grid td.mt-cell.filled .mt-cell-course{
    display:block;font-weight:600;font-size:10px;line-height:1.2;
  }
  table.mt-grid td.mt-cell.filled .mt-cell-room{
    display:block;font-weight:500;font-size:9px;line-height:1.2;color:rgba(255,255,255,.78);margin-top:1px;
  }

  .mt-course-list{display:flex;flex-direction:column;gap:6px;}
  .mt-course-item{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--line);background:var(--paper-2);
    border-radius:var(--radius);padding:9px 12px;
  }
  .mt-course-item .mt-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;flex-shrink:0;
  }
  .mt-course-item .mt-cinfo{display:flex;align-items:center;font-size:13px;}
  .mt-course-item .mt-cmeta{font-size:11px;color:var(--ink-dim);margin-left:4px;}
  .mt-remove-btn{border:none;background:none;color:var(--busy);font-size:12px;cursor:pointer;padding:2px 4px;}

  .mt-search{position:relative;margin-bottom:10px;}
  .mt-results{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;}
  .mt-result-item{
    border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius);
    padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  .mt-result-info .mt-rname{font-size:14px;font-weight:600;}
  .mt-result-info .mt-rmeta{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .mt-add-btn{
    flex-shrink:0;border:1px solid var(--amber);background:transparent;color:var(--amber);
    padding:6px 12px;font-size:12px;font-weight:700;border-radius:var(--radius);cursor:pointer;
  }
  .mt-add-btn:disabled{border-color:var(--line);color:var(--ink-dim);cursor:default;}
  .mt-empty{font-size:12px;color:var(--ink-dim);padding:4px 2px;}

  .note-block{
    font-size:11px;color:var(--ink-dim);line-height:1.6;
    padding-top:14px;margin-top:14px;border-top:1px dashed var(--line);
  }

  /* menu tab */
  .menu-day-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
  .menu-day-btn{
    flex-shrink:0;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-dim);
    padding:7px 14px;font-size:13px;border-radius:999px;cursor:pointer;white-space:nowrap;
  }
  .menu-day-btn.active{border-color:var(--amber);color:var(--amber);font-weight:700;}
  .menu-card{
    border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius);
    padding:16px;margin-bottom:10px;
  }
  .menu-card .m-hall{font-size:14px;font-weight:700;margin:0 0 2px;}
  .menu-card .m-meal{font-size:11px;color:var(--amber);margin:0 0 10px;}
  .menu-card .m-items{font-size:13px;line-height:1.7;color:var(--ink);}
  .menu-card .m-price{font-size:11px;color:var(--ink-dim);margin-top:8px;}

  /* notice tab */
  .notice-cat-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
  .notice-cat-btn{
    flex-shrink:0;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-dim);
    padding:7px 14px;font-size:13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-family:inherit;
  }
  .notice-cat-btn.active{border-color:var(--amber);color:var(--amber);font-weight:700;}
  .notice-item{
    border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:8px;cursor:pointer;
  }
  .notice-item .n-title{font-size:14px;font-weight:600;margin:0 0 4px;}
  .notice-item .n-meta{font-size:11px;color:var(--ink-dim);margin-bottom:6px;}
  .notice-item .n-meta span{margin-right:8px;}

  .notice-back-btn{
    border:1px solid var(--line);background:var(--paper-2);color:var(--ink);
    padding:8px 14px;font-size:13px;border-radius:var(--radius);cursor:pointer;font-family:inherit;margin-bottom:14px;
  }
  .notice-detail-title{font-size:17px;font-weight:700;margin:0 0 8px;line-height:1.4;}
  .notice-detail-meta{font-size:12px;color:var(--ink-dim);margin-bottom:16px;}
  .notice-detail-meta span{margin-right:10px;}
  .attach-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  .attach-item{
    display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper-2);
    border-radius:var(--radius);padding:9px 12px;font-size:13px;color:var(--amber);text-decoration:none;
  }
  .board-contents{font-size:14px;line-height:1.8;color:var(--ink);word-break:break-word;}
  .board-contents img{max-width:100%;height:auto;}
  .board-contents table{max-width:100%;}
  .notice-loading{font-size:13px;color:var(--ink-dim);text-align:center;padding:30px 0;}
  .notice-item .n-snippet{font-size:13px;color:var(--ink-dim);line-height:1.5;}

  .empty-state{
    text-align:center;padding:48px 20px;color:var(--ink-dim);font-size:13px;line-height:1.7;
  }
  .empty-state .es-icon{font-size:32px;margin-bottom:10px;display:block;}

  /* bottom tab bar */
  nav.tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:520px;margin:0 auto;
    display:flex;
    background:var(--tabbar-bg);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  .tab-btn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;
    color:var(--ink-dim);
    padding:9px 0 8px;
    font-size:11px;
    font-family:inherit;
    cursor:pointer;
  }
  .tab-btn .tb-icon{font-size:19px;line-height:1;}
  .tab-btn.active{color:var(--amber);}

  /* 식단/교통: 화면을 꽉 채우는 2칸 레이아웃 (사방 여백 12px로 동일) */
  .wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  #tabContents{flex:1;display:flex;flex-direction:column;}
  .tab-panel.fill.active{flex:1;display:flex;flex-direction:column;}
  .tab-panel.fill>section{flex:1;display:flex;flex-direction:column;padding:12px;border-bottom:none;}
  .tab-panel.fill>section>h2{margin:0 2px 10px;}
  .tab-panel.fill .menu-day-row{margin-bottom:12px;}
  .fill-cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch;min-height:0;}
  .fill-cols>.empty-state,.fill-cols>.placeholder{grid-column:1/-1;align-self:center;}
  .hall-col,.fill-cols>.bus-stop{
    border:1px solid var(--line);background:var(--paper-2);border-radius:var(--radius);
    padding:14px;margin:0;display:flex;flex-direction:column;min-width:0;
  }
  .hall-col .hc-title{font-size:16px;font-weight:700;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--amber);}
  .hall-col .hc-meal{padding:10px 0;border-top:1px dashed var(--line);}
  .hall-col .hc-meal:first-of-type{border-top:none;padding-top:0;}
  .hall-col .hc-meal .m-meal{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--amber);}
  .hall-col .hc-meal .m-items{font-size:13px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;}
  .hall-col .hc-meal .m-items.none{color:var(--ink-dim);}
  .hall-col .hc-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:13px;text-align:center;}
  .fill-cols>.bus-stop .bus-row .br-no{min-width:0;margin-right:6px;font-size:15px;}
  .fill-cols>.bus-stop .bus-row .br-info{padding:0 4px;}
  .fill-cols>.bus-stop .bus-row .br-eta{font-size:13px;white-space:nowrap;}
  @media (min-width:700px){
    .tab-panel.fill>section{padding:16px;}
    .hall-col,.fill-cols>.bus-stop{padding:18px;}
    .hall-col .hc-title{font-size:19px;}
    .hall-col .hc-meal .m-items{font-size:15px;}
    .fill-cols>.bus-stop .bus-row .br-no{font-size:18px;min-width:70px;}
    .fill-cols>.bus-stop .bus-row .br-eta{font-size:16px;}
  }

  /* 공지 검색 */
  .notice-search{margin-bottom:12px;}
  .notice-search-info{font-size:12px;color:var(--ink-dim);margin:-4px 2px 10px;}

  /* theme toggle */
  .theme-btn{
    position:absolute;right:16px;bottom:14px;
    display:flex;align-items:center;gap:5px;
    border:1px solid var(--line);background:var(--navy-2);color:var(--ink-dim);
    border-radius:999px;padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;
  }
  .theme-btn .t-icon{font-size:14px;line-height:1;}

  /* 태블릿(아이패드) 세로: 조금 넓게 */
  @media (min-width:700px){
    .wrap, nav.tabbar{max-width:none;}
    section{padding:24px 28px;}
    header.top{padding:20px 28px;}
    .weather{right:28px;}
    .theme-btn{right:28px;}
    .status-card .room-name{font-size:22px;}
    table.mt-grid td.mt-cell{width:auto;}
    table.mt-grid td.mt-cell.filled .mt-cell-course{font-size:12px;}
    table.mt-grid td.mt-cell.filled .mt-cell-room{font-size:10px;}
    table.mt-grid th{font-size:12px;}
    table.mt-grid td.mt-pcol{font-size:12px;width:28px;}
    #freeList{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
    #freeList>*{margin-bottom:0;}
    #freeList>.placeholder{grid-column:1/-1;}
  }
  /* 아이패드 가로 등 넓은 화면 */
  @media (min-width:1000px){
    body{font-size:17px;}
    #freeList{grid-template-columns:repeat(3,1fr);}
    .tab-btn{flex-direction:row;justify-content:center;gap:8px;font-size:13px;padding:12px 0;}
  }
  /* 가로 방향은 세로 공간이 부족하니 상단 바를 낮게 */
  @media (orientation:landscape) and (max-height:820px){
    header.top{padding-top:10px;padding-bottom:10px;}
    header.top .kicker{margin-bottom:2px;}
    header.top h1{margin-bottom:4px;font-size:18px;}
    :root{--tabbar-h:48px;}
    .tab-btn{padding:6px 0;}
  }
  @media (hover:hover){.tab-btn:hover,.theme-btn:hover,.free-item:hover,.notice-item:hover{color:var(--amber);}}

  /* ============================================================
     UI 다듬기: 둥근 모서리 · 큰 글씨 · 가운데 정렬 (아이폰/아이패드용)
     ============================================================ */
  :root{
    --radius:14px;
    --radius-lg:20px;
    --tabbar-h:66px;
    --amber-soft:rgba(217,155,63,.16);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --amber-soft:rgba(184,111,10,.12);
    --shadow:0 2px 14px rgba(20,20,40,.07);
  }
  body{font-size:16px;line-height:1.5;}

  /* 상단 바: 전부 가운데 정렬 */
  header.top{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;
    text-align:center;border-bottom:none;border-radius:0 0 26px 26px;
    padding:calc(14px + env(safe-area-inset-top)) 20px 16px;
    box-shadow:var(--shadow);
  }
  header.top .kicker{width:100%;font-size:13px;margin:0;}
  header.top h1{width:100%;font-size:24px;margin:0 0 2px;}
  .clock-row{width:auto;font-size:14px;align-items:center;justify-content:center;}
  .clock-row b{font-size:17px;}
  .weather,.theme-btn{position:static;padding:7px 13px;font-size:13px;}
  .weather .w-temp{font-size:15px;}
  .theme-btn .t-icon{font-size:15px;}

  /* 섹션 제목 */
  section{padding:20px 16px;}
  section h2{font-size:15px;letter-spacing:0;color:var(--ink);justify-content:center;text-align:center;margin:0 0 14px;font-weight:700;}
  .count-line{font-size:13px;text-align:center;}
  .note-block{font-size:13px;text-align:center;}
  .placeholder{font-size:15px;line-height:1.7;}

  /* 입력/버튼 (iOS는 16px 미만이면 입력 시 화면이 확대됨) */
  select,input[type=text]{font-size:16px;padding:14px 14px;border-radius:var(--radius);}
  select{padding-right:34px;}
  .go-btn{font-size:16px;padding:14px;border-radius:var(--radius);}
  .load-more,.notice-back-btn{font-size:15px;padding:12px 16px;border-radius:var(--radius);}
  .refresh-btn{font-size:13px;padding:8px 14px;border-radius:999px;}
  .mt-tool-btn{font-size:14px;padding:11px 0;}
  .mt-add-btn{font-size:14px;padding:9px 14px;}
  .menu-day-row,.notice-cat-row{justify-content:flex-start;padding-bottom:2px;}
  .menu-day-btn,.notice-cat-btn{font-size:15px;padding:9px 17px;}

  /* 카드: 둥글게 + 은은한 그림자 */
  .status-card,.menu-card,.notice-item,.bus-stop,.hall-col,.fill-cols>.bus-stop{
    border-radius:var(--radius-lg);box-shadow:var(--shadow);
  }
  .free-item,.mt-course-item,.mt-result-item,.attach-item{border-radius:var(--radius);}

  /* 강의실 현황 */
  .status-card{text-align:center;padding:22px 18px;}
  .status-card .room-name{font-size:24px;}
  .status-card .room-sub{font-size:14px;}
  .badge{font-size:14px;padding:6px 14px;}
  .class-row .cname{font-size:18px;}
  .class-row .cmeta{font-size:14px;}
  .free-item{font-size:16px;padding:13px 16px;}
  .free-item .fr-tag{font-size:13px;}
  .mt-course-item .mt-cinfo{font-size:15px;}
  .mt-course-item .mt-cmeta{font-size:13px;}
  .mt-result-info .mt-rname{font-size:16px;}
  .mt-result-info .mt-rmeta{font-size:13px;}
  .mt-empty{font-size:14px;}
  table.mt-grid{font-size:13px;}
  table.mt-grid th{font-size:12px;padding:7px 2px;}
  table.mt-grid td.mt-pcol{font-size:12px;width:26px;}
  table.mt-grid td.mt-cell{height:30px;}
  table.mt-grid td.mt-cell.filled{height:46px;}
  table.mt-grid td.mt-cell.filled .mt-cell-course{font-size:11px;}
  table.mt-grid td.mt-cell.filled .mt-cell-room{font-size:10px;}

  /* 식단 */
  .hall-col .hc-title{font-size:19px;text-align:center;border-bottom-width:3px;border-radius:2px;}
  .hall-col .hc-meal{text-align:center;padding:14px 0;}
  .hall-col .hc-meal .m-meal{font-size:14px;margin-bottom:8px;}
  .hall-col .hc-meal .m-items{font-size:16px;line-height:1.8;}
  .hall-col .hc-empty{font-size:15px;}
  .menu-card .m-hall{font-size:16px;}
  .menu-card .m-items{font-size:15px;}

  /* 교통 */
  .tab-panel[data-tab="bus"] section h2{position:relative;min-height:38px;}
  #busRefreshBtn{position:absolute;right:0;top:50%;transform:translateY(-50%);}
  .fill-cols>.bus-stop,.bus-stop{padding:18px 16px;text-align:center;}
  .bus-stop .bs-title{font-size:19px;margin-bottom:4px;}
  .bus-stop .bs-sub{font-size:13px;margin-bottom:12px;}
  .bus-row,.fill-cols>.bus-stop .bus-row{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:13px 0;text-align:center;
  }
  .bus-row .br-no,.fill-cols>.bus-stop .bus-row .br-no{
    font-size:19px;min-width:56px;margin:0;padding:5px 10px;border-radius:999px;background:var(--amber-soft);text-align:center;
  }
  .bus-row .br-info,.fill-cols>.bus-stop .bus-row .br-info{font-size:14px;padding:0;text-align:center;}
  .bus-row .br-eta,.fill-cols>.bus-stop .bus-row .br-eta{font-size:18px;min-width:76px;text-align:right;}

  /* 공지 */
  .notice-item{padding:16px 18px;}
  .notice-item .n-title{font-size:16px;line-height:1.45;}
  .notice-item .n-meta{font-size:13px;}
  .notice-item .n-snippet{font-size:14px;}
  .n-pin{font-size:13px;}
  .notice-search-info{font-size:13px;text-align:center;}
  .notice-detail-title{font-size:21px;}
  .notice-detail-meta{font-size:14px;}
  .attach-item{font-size:15px;padding:12px 14px;}
  .board-contents{font-size:16px;line-height:1.85;}
  .notice-loading{font-size:15px;}
  .empty-state{font-size:15px;}

  /* 하단 탭바 */
  nav.tabbar{
    border-top:none;border-radius:22px 22px 0 0;
    box-shadow:0 -4px 20px rgba(0,0,0,.18);
  }
  .tab-btn{font-size:12px;padding:10px 0 8px;font-weight:600;}
  .tab-btn .tb-icon{font-size:23px;}

  /* 아이폰(좁은 화면): 카드를 한 줄에 하나씩 크게 */
  @media (max-width:599px){
    .fill-cols{grid-template-columns:1fr;align-content:start;}
  }

  /* 아이패드: 가운데에 적당한 폭으로 */
  @media (min-width:700px){
    .wrap,nav.tabbar{max-width:920px;margin-left:auto;margin-right:auto;}
    header.top{padding:calc(18px + env(safe-area-inset-top)) 28px 20px;}
    header.top h1{font-size:28px;}
    header.top .kicker{font-size:14px;}
    .clock-row{font-size:15px;}.clock-row b{font-size:19px;}
    .weather,.theme-btn{font-size:14px;padding:8px 15px;}
    section{padding:26px 28px;}
    section h2{font-size:17px;}
    .tab-panel.fill>section{padding:22px;}
    .status-card .room-name{font-size:28px;}
    .free-item{font-size:17px;}
    .hall-col,.fill-cols>.bus-stop{padding:22px;}
    .hall-col .hc-title{font-size:22px;}
    .hall-col .hc-meal .m-items{font-size:18px;}
    .hall-col .hc-meal .m-meal{font-size:15px;}
    .bus-stop .bs-title{font-size:22px;}
    .bus-stop .bs-sub{font-size:14px;}
    .bus-row .br-no,.fill-cols>.bus-stop .bus-row .br-no{font-size:22px;min-width:68px;}
    .bus-row .br-info,.fill-cols>.bus-stop .bus-row .br-info{font-size:15px;}
    .bus-row .br-eta,.fill-cols>.bus-stop .bus-row .br-eta{font-size:21px;min-width:88px;}
    .notice-item .n-title{font-size:18px;}
    .notice-item .n-meta{font-size:14px;}
    .notice-item .n-snippet{font-size:15px;}
    .board-contents{font-size:18px;}
    table.mt-grid th,table.mt-grid td.mt-pcol{font-size:13px;}
    table.mt-grid td.mt-cell.filled .mt-cell-course{font-size:13px;}
    table.mt-grid td.mt-cell.filled .mt-cell-room{font-size:11px;}
    .tab-btn{font-size:13px;}
  }
  @media (min-width:1000px){
    .tab-btn{flex-direction:row;font-size:15px;}
  }
  /* 가로 방향 낮은 화면은 상단 바를 컴팩트하게 */
  @media (orientation:landscape) and (max-height:820px){
    header.top{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:10px;gap:4px 10px;}
    header.top h1{font-size:19px;margin:0;}
    :root{--tabbar-h:52px;}
    .tab-btn .tb-icon{font-size:20px;}
  }
</style>
</head>

<div class="wrap">

  <header class="top">
    <p class="kicker">국립금오공과대학교 KIT</p>
    <h1 id="pageTitle">강의실별 수업현황</h1>
    <div class="clock-row">
      <span>현재</span><b id="clockText">-</b>
    </div>
    <div class="weather" id="weatherBox" title="구미시 거의동 현재 날씨">
      <span class="w-icon" id="wIcon">⛅</span>
      <span class="w-temp" id="wTemp">--°</span>
      <span class="w-desc" id="wDesc">거의동</span>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="화면 모드 바꾸기">
      <span class="t-icon" id="themeIcon">🌙</span><span id="themeLabel">다크</span>
    </button>
  </header>

  <main id="tabContents">

    <!-- ===== TAB: 강의실별 수업현황 ===== -->
    <div class="tab-panel active" data-tab="rooms">
      <section>
        <h2>강의실 선택</h2>
        <div class="picker-row">
          <select id="buildingSel"></select>
          <select id="roomSel" disabled></select>
        </div>
      </section>

      <section>
        <h2>선택한 강의실 · 지금 상태</h2>
        <div id="statusArea">
          <p class="placeholder">위에서 건물과 강의실을 선택하면<br>지금 사용 중인지 보여드려요.</p>
        </div>
      </section>

      <section>
        <h2>다른 시간 조회하기</h2>
        <div class="time-row">
          <select id="daySel"></select>
          <select id="periodSel"></select>
        </div>
        <button class="go-btn" id="checkBtn">이 시간 조회</button>
        <div id="manualResult" style="margin-top:12px;"></div>
      </section>

      <section>
        <h2>지금 비어있는 강의실</h2>
        <div class="free-picker">
          <select id="freeBuildingSel"></select>
        </div>
        <p class="count-line" id="freeCount"></p>
        <div class="free-list" id="freeList"></div>
        <p class="note-block">학교 수업시간표(개설강좌 편람) 기준이며, 휴강·보강 등 변동사항은 반영되지 않을 수 있어요.<br>같은 건물의 지하층(예: 테크노관지하)은 지상층과 한 건물로 묶었어요.</p>
      </section>
    </div>

    <!-- ===== TAB: 식단 ===== -->
    <div class="tab-panel fill" data-tab="menu">
      <section>
        <h2>오늘의 학식</h2>
        <div class="menu-day-row" id="menuDayRow"></div>
        <div class="fill-cols" id="menuArea"></div>
      </section>
    </div>

    <!-- ===== TAB: 교통 ===== -->
    <div class="tab-panel fill" data-tab="bus">
      <section>
        <h2><span>금오공대 버스 도착정보</span><button class="refresh-btn" id="busRefreshBtn">새로고침</button></h2>
        <p class="count-line" id="busUpdated"></p>
        <div class="fill-cols" id="busArea"></div>
        <p class="note-block">국토교통부 TAGO 버스도착정보 기준이며, 실제 도착 시간과 다를 수 있어요.</p>
      </section>
    </div>

    <!-- ===== TAB: 교내공지 ===== -->
    <div class="tab-panel" data-tab="notice">
      <div id="noticeListView">
        <section>
          <h2>교내 공지</h2>
          <input type="text" class="notice-search" id="noticeSearch" placeholder="공지 제목·부서 검색" enterkeyhint="search" autocomplete="off">
          <div class="notice-cat-row" id="noticeCatRow"></div>
          <p class="notice-search-info" id="noticeSearchInfo" style="display:none;"></p>
          <div id="noticeArea"></div>
        </section>
      </div>
      <div id="noticeDetailView" style="display:none;">
        <section>
          <button class="notice-back-btn" id="noticeBackBtn">‹ 목록으로</button>
          <div id="noticeDetailArea"></div>
        </section>
      </div>
    </div>

  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn active" data-tab="rooms"><span class="tb-icon">🏫</span><span>강의실현황</span></button>
  <button class="tab-btn" data-tab="menu"><span class="tb-icon">🍽️</span><span>식단</span></button>
  <button class="tab-btn" data-tab="bus"><span class="tb-icon">🚌</span><span>교통</span></button>
  <button class="tab-btn" data-tab="notice"><span class="tb-icon">📢</span><span>공지</span></button>
</nav>

34","room":"DB125","course":"미술의이해","prof":"서희주","dept":"","code":"LA0257-01"},{"day":"월","periods":"12","room":"GB101","course":"리더십과커뮤니케이션","prof":"이병진","dept":"","code":"LA0264-01"},{"day":"월","periods":"34","room":"GB101","course":"리더십과커뮤니케이션","prof":"이병진","dept":"","code":"LA0264-02"},{"day":"월","periods":"56","room":"GB101","course":"리더십과커뮤니케이션","prof":"이병진","dept":"","code":"LA0264-03"},{"day":"화","periods":"89","room":"DB132","course":"생성형AI를활용한문제해결","prof":"김중현","dept":"","code":"LA0427-01"},{"day":"월","periods":"23","room":"DB125","course":"예술과와인으로배우는글로벌매너","prof":"서희주","dept":"","code":"LA0431-01"},{"day":"월","periods":"34","room":"DB131","course":"글로벌커뮤니케이션","prof":"김혜경","dept":"스마트모빌리티전공 1학년 ","code":"LA0365-04"},{"day":"수","periods":"6","room":"국제316","course":"글로벌커뮤니케이션","prof":"김혜경","dept":"스마트모빌리티전공 1학년 ","code":"LA0365-04"},{"day":"화","periods":"89","room":"DB127","course":"전자공학입문","prof":"정재진","dept":"자율전공학부 1학년 ","code":"LA0609-01"},{"day":"월","periods":"1","room":"D323","course":"회로이론2","prof":"박정수","dept":"전자시스템전공 2학년 ","code":"FA3012-03"},{"day":"수","periods":"12","room":"D323","course":"회로이론2","prof":"박정수","dept":"전자시스템전공 2학년 ","code":"FA3012-03"},{"day":"금","periods":"34","room":"산학503","course":"4차산업혁명의이해","prof":"최헌웅","dept":"","code":"LA0339-01"},{"day":"수","periods":"34","room":"T301","course":"창업마케팅","prof":"조영준","dept":"","code":"LA0311-01"},{"day":"수","periods":"89","room":"T301","course":"창업마케팅","prof":"조영준","dept":"","code":"LA0311-02"},{"day":"금","periods":"ABC","room":"산학503","course":"모의창업실습2","prof":"조영준","dept":"","code":"FP8002-01"},{"day":"월","periods":"45","room":"DB125","course":"음악의이해","prof":"조사무엘","dept":"","code":"LA0114-01"},{"day":"수","periods":"89","room":"에디슨306","course":"SSU반도체융합특론2","prof":"김민석","dept":"","code":"SK0068-01"},{"day":"화","periods":"67","room":"GB101","course":"미디어로보는회계","prof":"구정호","dept":"","code":"LA0421-01"},{"day":"수","periods":"23","room":"GB101","course":"미디어로보는회계","prof":"구정호","dept":"","code":"LA0421-02"},{"day":"월","periods":"67","room":"DB125","course":"음악의이해","prof":"조사무엘","dept":"","code":"LA0114-02"},{"day":"수","periods":"89","room":"DB127","course":"컴퓨터공학입문","prof":"이이섭","dept":"인공지능공학전공 1학년 컴퓨터공학전공 1학년 자율전공학부 1학년 ","code":"GA3044-01"},{"day":"금","periods":"789","room":"산학104","course":"방산AI세미나","prof":"이승환","dept":"","code":"MR0044-01"}];</script>
<script>
(function(){
  const DAYS = ['월','화','수','목','금','토','일'];
  const DAY_FULL = {'월':'월요일','화':'화요일','수':'수요일','목':'목요일','금':'금요일','토':'토요일','일':'일요일'};

  // ---- period helpers ----
  function periodVal(ch){
    if(ch>='0'&&ch<='9') return ch.charCodeAt(0)-48;
    return 10 + (ch.toUpperCase().charCodeAt(0)-65);
  }
  function periodLabel(ch){ return ch.toUpperCase()+'교시'; }
  function periodStartHour(ch){ return 8 + periodVal(ch); }
  function periodTimeRangeExact(ch){
    const h = periodStartHour(ch);
    const hh = String(h).padStart(2,'0');
    return hh+':00-'+hh+':50';
  }
  const ALL_PERIODS = '0123456789ABCDE'.split('');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

// ===================== 데이터 로더 (GitHub Actions가 만든 data/*.json) =====================
  // 마지막으로 받은 JSON은 localStorage에 보관해서, 다음 방문 때 즉시 보여주고 뒤에서 갱신한다.
  // 데이터는 GitHub Actions가 'data' 브랜치에 올려둔 JSON을 읽는다.
  //  - GitHub Pages(https://아이디.github.io/저장소/)에서 열면 주소를 자동으로 계산
  //  - 그 외(내 컴퓨터 테스트 등)에는 아래 DATA_BASE_OVERRIDE 에 직접 적어도 됨
  const DATA_BASE_OVERRIDE = '';
  const DATA_BASE = (function(){
    if(DATA_BASE_OVERRIDE) return DATA_BASE_OVERRIDE;
    const h = location.hostname;
    if(h.endsWith('.github.io')){
      const repo = location.pathname.split('/')[1];
      return 'https://raw.githubusercontent.com/'+h.split('.')[0]+'/'+repo+'/data/';
    }
    return 'data/';
  })();

  const CACHE_PREFIX = 'kumohData_v2:';
  function readCache(path){
    try{ return JSON.parse(localStorage.getItem(CACHE_PREFIX+path)); }catch(e){ return null; }
  }
  function writeCache(path, data){
    try{ localStorage.setItem(CACHE_PREFIX+path, JSON.stringify(data)); }catch(e){}
  }
  async function fetchJson(path){
    const res = await fetch(DATA_BASE+path, { cache:'no-cache' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }
  // onData(data, fromCache) 를 캐시(있으면)와 최신 데이터로 각각 호출한다.
  // 네트워크가 실패해도 캐시가 이미 표시됐다면 에러를 던지지 않는다.
  // persist=false 면 localStorage에 저장하지 않는다 (용량 큰 공지 본문용).
  async function loadJsonSWR(path, onData, persist){
    if(persist === undefined) persist = true;
    const cached = persist ? readCache(path) : null;
    if(cached) onData(cached, true);
    try{
      const fresh = await fetchJson(path);
      if(persist) writeCache(path, fresh);
      onData(fresh, false);
    }catch(e){
      if(!cached) throw e;
    }
  }

  // ---- building label mapping (merged: basement folded into main building) ----
  function rawPrefix(room){
    const m = room.match(/^([가-힣A-Za-z]+)/);
    return m ? m[1] : room;
  }
  const KNOWN_LABEL = { 'T':'테크노관', 'D':'디지털관', 'G':'글로벌관', '에디슨':'에디슨관' };

  // ---- index data ----
  const rooms = {};
  SCHEDULE_DATA.forEach(r=>{
    if(!rooms[r.room]) rooms[r.room] = [];
    rooms[r.room].push({
      day:r.day, periodChars: r.periods.split(''),
      course:r.course, prof:r.prof, dept:(r.dept||'').trim(), code:r.code
    });
  });
  const allRoomNames = Object.keys(rooms).sort((a,b)=>a.localeCompare(b,'ko'));
  const allPrefixes = new Set(allRoomNames.map(rawPrefix));

  function baseOf(prefix){
    if(prefix.endsWith('B') && prefix.length>1 && allPrefixes.has(prefix.slice(0,-1))) return prefix.slice(0,-1);
    return prefix;
  }
  function buildingInfo(room){
    const prefix = rawPrefix(room);
    const base = baseOf(prefix);
    const label = KNOWN_LABEL[base] || base;
    return {prefix, base, label};
  }

  const buildingGroups = {};
  allRoomNames.forEach(n=>{
    const bi = buildingInfo(n);
    if(!buildingGroups[bi.base]) buildingGroups[bi.base] = {label:bi.label, rooms:[]};
    buildingGroups[bi.base].rooms.push(n);
  });
  Object.values(buildingGroups).forEach(g=>g.rooms.sort((a,b)=>a.localeCompare(b,'ko')));
  const buildingBases = Object.keys(buildingGroups).sort((a,b)=>buildingGroups[b].rooms.length - buildingGroups[a].rooms.length);

  let selectedBase = null;
  let selectedRoom = null;

  const buildingSel = document.getElementById('buildingSel');
  const roomSel = document.getElementById('roomSel');
  (function initBuildingSel(){
    const ph = document.createElement('option');
    ph.value=''; ph.textContent='건물 선택'; ph.disabled=true; ph.selected=true;
    buildingSel.appendChild(ph);
    buildingBases.forEach(base=>{
      const o = document.createElement('option');
      o.value = base;
      o.textContent = buildingGroups[base].label+' ('+buildingGroups[base].rooms.length+')';
      buildingSel.appendChild(o);
    });
  })();

  function populateRoomSel(base){
    roomSel.innerHTML='';
    if(!base){
      roomSel.disabled = true;
      const ph = document.createElement('option');
      ph.value=''; ph.textContent='강의실 선택'; ph.selected=true;
      roomSel.appendChild(ph);
      return;
    }
    roomSel.disabled = false;
    const ph = document.createElement('option');
    ph.value=''; ph.textContent='강의실 선택'; ph.disabled=true; ph.selected=true;
    roomSel.appendChild(ph);
    buildingGroups[base].rooms.forEach(n=>{
      const o = document.createElement('option');
      o.value=n; o.textContent=n;
      roomSel.appendChild(o);
    });
  }

  buildingSel.addEventListener('change', ()=>{
    selectedBase = buildingSel.value || null;
    selectedRoom = null;
    populateRoomSel(selectedBase);
    renderStatus();
  });
  roomSel.addEventListener('change', ()=>{
    selectedRoom = roomSel.value || null;
    renderStatus();
  });
  populateRoomSel(null);

  function findClassAt(room, day, ch){
    const entries = rooms[room] || [];
    for(const e of entries){ if(e.day===day && e.periodChars.includes(ch)) return e; }
    return null;
  }

  function nowDayPeriod(){
    const d = new Date();
    let dow = d.getDay();
    const dayChar = ['일','월','화','수','목','금','토'][dow];
    const hour = d.getHours();
    let val = hour - 8;
    let ch = null;
    if(val>=0 && val<=14){ ch = val<=9? String(val) : String.fromCharCode(65+(val-10)); }
    return {day:dayChar, ch, hour, minute:d.getMinutes()};
  }

  function renderClock(){
    const {day, hour, minute} = nowDayPeriod();
    const hh = String(hour).padStart(2,'0');
    const mm = String(minute).padStart(2,'0');
    document.getElementById('clockText').textContent = DAY_FULL[day]+' '+hh+':'+mm;
  }

  function statusCardHTML(room, day, ch){
    const bi = buildingInfo(room);
    const match = findClassAt(room, day, ch);
    let inner = '';
    if(ch===null){
      inner = '<span class="badge free">운영시간 외</span><div class="class-row"><p class="cmeta">이 시간대는 정규 교시(0~E교시)에 해당하지 않아요.</p></div>';
    } else if(match){
      inner = '<span class="badge busy">사용중</span>'+
        '<div class="class-row">'+
          '<p class="cname">'+escapeHtml(match.course)+'</p>'+
          '<p class="cmeta">'+escapeHtml(match.prof||'담당교수 미기재')+(match.dept? ' · '+escapeHtml(match.dept):'')+'</p>'+
          '<p class="cmeta" style="margin-top:6px;">'+periodLabel(ch)+' · '+periodTimeRangeExact(ch)+'</p>'+
        '</div>';
    } else {
      inner = '<span class="badge free">비어있음</span>'+
        '<div class="class-row"><p class="cmeta">'+periodLabel(ch)+' ('+periodTimeRangeExact(ch)+') 기준, 등록된 수업이 없어요.</p></div>';
    }
    return '<div class="status-card"><p class="room-name">'+room+'</p><p class="room-sub">'+bi.label+'</p>'+inner+'</div>';
  }

  function renderStatus(){
    const el = document.getElementById('statusArea');
    if(!selectedRoom){
      el.innerHTML = '<p class="placeholder">위에서 건물과 강의실을 선택하면<br>지금 사용 중인지 보여드려요.</p>';
      return;
    }
    const {day, ch} = nowDayPeriod();
    el.innerHTML = statusCardHTML(selectedRoom, day, ch);
  }

  const daySel = document.getElementById('daySel');
  const periodSel = document.getElementById('periodSel');
  DAYS.forEach(d=>{
    const o = document.createElement('option'); o.value=d; o.textContent = DAY_FULL[d]; daySel.appendChild(o);
  });
  ALL_PERIODS.forEach(ch=>{
    const o = document.createElement('option'); o.value=ch; o.textContent = periodLabel(ch)+' ('+periodTimeRangeExact(ch)+')'; periodSel.appendChild(o);
  });
  (function(){
    const {day, ch} = nowDayPeriod();
    daySel.value = day;
    if(ch!==null) periodSel.value = ch;
  })();
  document.getElementById('checkBtn').addEventListener('click', ()=>{
    const el = document.getElementById('manualResult');
    if(!selectedRoom){ el.innerHTML = '<p class="placeholder">먼저 건물과 강의실을 선택해주세요.</p>'; return; }
    const day = daySel.value, ch = periodSel.value;
    el.innerHTML = statusCardHTML(selectedRoom, day, ch);
  });

  const freeBuildingSel = document.getElementById('freeBuildingSel');
  (function initFreeBuildingSel(){
    const allOpt = document.createElement('option');
    allOpt.value=''; allOpt.textContent='건물 선택 (전체 보려면 비워두기)';
    freeBuildingSel.appendChild(allOpt);
    buildingBases.forEach(base=>{
      const o = document.createElement('option');
      o.value = base; o.textContent = buildingGroups[base].label+' ('+buildingGroups[base].rooms.length+')';
      freeBuildingSel.appendChild(o);
    });
  })();
  freeBuildingSel.addEventListener('change', renderFreeRooms);

  function renderFreeRooms(){
    const {day, ch} = nowDayPeriod();
    const countEl = document.getElementById('freeCount');
    const listEl = document.getElementById('freeList');
    if(ch===null){
      countEl.textContent = '지금은 정규 교시 시간이 아니에요 (0~E교시 밖).';
      listEl.innerHTML=''; return;
    }
    const freeBase = freeBuildingSel.value || null;
    let pool = freeBase ? buildingGroups[freeBase].rooms : allRoomNames;
    const free = pool.filter(n=>!findClassAt(n, day, ch));
    const scopeLabel = freeBase ? buildingGroups[freeBase].label : '전체 건물';
    countEl.textContent = DAY_FULL[day]+' '+periodLabel(ch)+' · '+scopeLabel+' · 빈 강의실 '+free.length+'개 / '+pool.length+'개';
    listEl.innerHTML='';
    if(!freeBase){ listEl.innerHTML = '<div class="placeholder">건물을 선택하면 그 건물의 빈 강의실이 나와요.</div>'; return; }
    if(free.length===0){ listEl.innerHTML = '<div class="placeholder">지금 이 건물에는 빈 강의실이 없어요.</div>'; return; }
    free.forEach(n=>{
      const item = document.createElement('div');
      item.className='free-item';
      item.innerHTML = '<span class="fr-room">'+n+'</span><span class="fr-tag">비어있음</span>';
      item.onclick = ()=>{
        const bi = buildingInfo(n);
        selectedBase = bi.base; buildingSel.value = bi.base; populateRoomSel(bi.base);
        selectedRoom = n; roomSel.value = n;
        renderStatus();
        switchTab('rooms');
        window.scrollTo({top:0, behavior:'smooth'});
      };
      listEl.appendChild(item);
    });
  }

  // ===================== 식단 tab =====================
  // 식단은 GitHub Actions가 학교 사이트에서 크롤링해 둔 data/menu.json 을 읽어서 채운다.
  // MENU_DATA['월'] = [ {hall, meal, items:[...], price}, ... ]
  const MENU_DATA = {};
  const MENU_WEEK_DATES = {}; // 요일 -> '08.31' 형태 날짜 문자열

  const menuDayRow = document.getElementById('menuDayRow');
  const menuArea = document.getElementById('menuArea');
  let menuSelectedDay = nowDayPeriod().day;
  if(!DAYS.slice(0,5).includes(menuSelectedDay)) menuSelectedDay = '월';

  function initMenuDayRow(){
    menuDayRow.innerHTML='';
    DAYS.slice(0,5).forEach(d=>{
      const btn = document.createElement('button');
      btn.className = 'menu-day-btn'+(d===menuSelectedDay?' active':'');
      btn.textContent = MENU_WEEK_DATES[d] ? d+' ('+MENU_WEEK_DATES[d]+')' : d;
      btn.onclick = ()=>{ menuSelectedDay = d; initMenuDayRow(); renderMenu(); };
      menuDayRow.appendChild(btn);
    });
  }

  function renderMenu(){
    const list = MENU_DATA[menuSelectedDay] || [];
    if(Object.keys(MENU_DATA).every(d=>!MENU_DATA[d] || MENU_DATA[d].length===0)){
      menuArea.innerHTML = '<div class="empty-state"><span class="es-icon">🍽️</span>아직 연결된 식단 정보가 없어요.<br>학교 식단 데이터를 연결하면 이 탭에 바로 표시돼요.</div>';
      return;
    }
    // 식당마다 한 칸. 칸 안에 그날의 모든 끼니(조식, 일품요리 등)를 함께 보여준다. 데이터가 없어도 두 칸은 항상 유지.
    const HALLS = ['정찬식당','일품식당'];
    menuArea.innerHTML = HALLS.map(hall=>{
      const meals = list.filter(m=>m.hall===hall);
      const body = meals.length ? meals.map(m=>{
        const none = m.items.length===1 && m.items[0]==='정보 없음';
        return '<div class="hc-meal">'+
          '<p class="m-meal">'+escapeHtml(m.meal)+(m.price? ' · '+escapeHtml(m.price):'')+'</p>'+
          '<p class="m-items'+(none?' none':'')+'">'+m.items.map(escapeHtml).join('<br>')+'</p>'+
        '</div>';
      }).join('') : '<div class="hc-empty">등록된 식단이 없어요</div>';
      return '<div class="hall-col"><p class="hc-title">'+escapeHtml(hall)+'</p>'+body+'</div>';
    }).join('');
  }

  function applyMenuData(data){
    DAYS.forEach(d=>{
      MENU_DATA[d] = (data.days && data.days[d]) || [];
      if(data.dates && data.dates[d]) MENU_WEEK_DATES[d] = data.dates[d];
    });
    initMenuDayRow();
    renderMenu();
  }

  let menuLoading = false;
  async function tryLoadMenu(){
    if(menuLoading) return;
    menuLoading = true;
    if(!readCache('menu.json')){
      menuArea.innerHTML = '<div class="empty-state"><span class="es-icon">🍽️</span>식단을 불러오는 중이에요…</div>';
    }
    try{
      await loadJsonSWR('menu.json', applyMenuData);
    }catch(e){
      menuArea.innerHTML = '<div class="empty-state"><span class="es-icon">🍽️</span>식단 정보를 불러오지 못했어요.<br>네트워크 상태를 확인하고 다시 시도해주세요.</div>';
    }finally{
      menuLoading = false;
    }
  }

  // ===================== 교내공지 tab =====================
  const NOTICE_CATEGORIES = [
    { key:'academic', label:'학사안내', url:'https://www.kumoh.ac.kr/ko/sub06_01_01_01.do' },
    { key:'event',    label:'행사안내', url:'https://www.kumoh.ac.kr/ko/sub06_01_01_02.do' },
    { key:'news',     label:'일반소식', url:'https://www.kumoh.ac.kr/ko/sub06_01_01_03.do' }
  ];
  let noticeSelectedCat = NOTICE_CATEGORIES[0].key;
  let NOTICE_DATA = [];

  const noticeCatRow = document.getElementById('noticeCatRow');
  const noticeArea = document.getElementById('noticeArea');
  const noticeListView = document.getElementById('noticeListView');
  const noticeDetailView = document.getElementById('noticeDetailView');
  const noticeDetailArea = document.getElementById('noticeDetailArea');
  const noticeBackBtn = document.getElementById('noticeBackBtn');

  function currentNoticeCategory(){ return NOTICE_CATEGORIES.find(c=>c.key===noticeSelectedCat); }

  function initNoticeCatRow(){
    noticeCatRow.innerHTML='';
    NOTICE_CATEGORIES.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = 'notice-cat-btn'+(c.key===noticeSelectedCat?' active':'');
      btn.textContent = c.label;
      btn.onclick = ()=>{
        if(noticeSelectedCat===c.key) return;
        noticeSelectedCat = c.key;
        initNoticeCatRow();
        tryLoadNotices();
      };
      noticeCatRow.appendChild(btn);
    });
  }

  // 공지는 글번호 구간(5000개 단위)별 파일로 나뉘어 있고, 최신 구간부터 "더 보기"로 이어서 불러온다.
  //   notices/{카테고리}/index.json  : { buckets:[큰 번호부터], pinned:[고정공지] }
  //   notices/{카테고리}/b{구간}.json : { items:[글번호 내림차순] }
  const NOTICE_PAGE_MIN = 30; // 한 번에 최소 이 개수 이상 보여주기
  let noticeIndex = null;
  let noticeNextBucket = 0;
  let noticeShown = [];

  function noticeItemHtml(n, pinned){
    return '<div class="notice-item" data-article-no="'+escapeHtml(n.articleNo)+'">'+
      '<p class="n-title">'+(pinned?'<span class="n-pin">공지</span>':'')+escapeHtml(n.title)+'</p>'+
      '<p class="n-meta">'+
        (n.dept? '<span>'+escapeHtml(n.dept)+'</span>':'')+
        (n.date? '<span>'+escapeHtml(n.date)+'</span>':'')+
        (n.hit? '<span>조회 '+escapeHtml(n.hit)+'</span>':'')+
      '</p>'+
    '</div>';
  }

  let noticeQuery = ''; // 소문자로 정규화된 검색어. 비어 있으면 검색 안 함
  const noticeSearch = document.getElementById('noticeSearch');
  const noticeSearchInfo = document.getElementById('noticeSearchInfo');
  const matchesNotice = (n)=> ((n.title||'')+' '+(n.dept||'')).toLowerCase().includes(noticeQuery);

  function renderNotices(){
    const allPinned = (noticeIndex && noticeIndex.pinned) || [];
    const pinned = noticeQuery ? allPinned.filter(matchesNotice) : allPinned;
    const shown = noticeQuery ? noticeShown.filter(matchesNotice) : noticeShown;
    const searching = !!noticeQuery;
    const allLoaded = !noticeIndex || noticeNextBucket >= noticeIndex.buckets.length;
    noticeSearchInfo.style.display = searching ? '' : 'none';
    if(searching) noticeSearchInfo.textContent = allLoaded ? '"'+noticeSearch.value.trim()+'" 검색 결과' : '전체 공지에서 검색하는 중이에요…';
    if(pinned.length===0 && shown.length===0){
      noticeArea.innerHTML = searching
        ? '<div class="empty-state"><span class="es-icon">🔍</span>'+(allLoaded?'검색 결과가 없어요.':'검색하는 중이에요…')+'</div>'
        : '<div class="empty-state"><span class="es-icon">📢</span>표시할 공지사항이 없어요.</div>';
      return;
    }
    const pinnedNos = new Set(pinned.map(p=>p.articleNo));
    const hasMore = !searching && noticeIndex && noticeNextBucket < noticeIndex.buckets.length;
    noticeArea.innerHTML =
      pinned.map(n=>noticeItemHtml(n,true)).join('')+
      shown.filter(n=>!pinnedNos.has(n.articleNo)).map(n=>noticeItemHtml(n,false)).join('')+
      (hasMore ? '<button class="load-more" id="noticeMoreBtn">이전 공지 더 보기</button>' : '');
    noticeArea.querySelectorAll('.notice-item').forEach(el=>{
      el.addEventListener('click', ()=> openNoticeDetail(el.getAttribute('data-article-no')));
    });
    const more = document.getElementById('noticeMoreBtn');
    if(more) more.addEventListener('click', ()=>{ more.disabled = true; more.textContent = '불러오는 중…'; loadMoreNotices(noticeReqId).catch(()=>{ more.disabled=false; more.textContent='다시 시도'; }); });
  }

  // 최소 NOTICE_PAGE_MIN개가 추가될 때까지 구간 파일을 이어서 읽는다.
  async function loadMoreNotices(reqId){
    let added = 0;
    while(added < NOTICE_PAGE_MIN && noticeIndex && noticeNextBucket < noticeIndex.buckets.length){
      const b = noticeIndex.buckets[noticeNextBucket];
      const data = await fetchJson('notices/'+noticeSelectedCat+'/b'+b+'.json');
      if(reqId !== noticeReqId) return;
      noticeNextBucket++;
      noticeShown = noticeShown.concat(data.items || []);
      added += (data.items || []).length;
    }
    if(reqId === noticeReqId) renderNotices();
  }

  // 검색할 때는 아직 안 읽은 구간 파일을 전부 읽어서 전체 공지에서 찾는다.
  async function loadAllNotices(reqId){
    while(noticeIndex && noticeNextBucket < noticeIndex.buckets.length){
      const b = noticeIndex.buckets[noticeNextBucket];
      const data = await fetchJson('notices/'+noticeSelectedCat+'/b'+b+'.json');
      if(reqId !== noticeReqId) return;
      noticeNextBucket++;
      noticeShown = noticeShown.concat(data.items || []);
      renderNotices();
    }
  }

  let noticeSearchTimer = null;
  noticeSearch.addEventListener('input', ()=>{
    clearTimeout(noticeSearchTimer);
    noticeSearchTimer = setTimeout(async ()=>{
      noticeQuery = noticeSearch.value.trim().toLowerCase();
      renderNotices();
      if(noticeQuery){
        try{ await loadAllNotices(noticeReqId); }catch(e){ noticeSearchInfo.textContent = '일부 공지를 불러오지 못했어요. 다시 시도해주세요.'; }
      }
    }, 250);
  });

  let noticeReqId = 0; // 카테고리를 빠르게 바꿔도 마지막 요청만 반영
  async function tryLoadNotices(){
    const reqId = ++noticeReqId;
    noticeIndex = null; noticeNextBucket = 0; noticeShown = [];
    noticeArea.innerHTML = '<div class="notice-loading">공지사항을 불러오는 중이에요…</div>';
    try{
      noticeIndex = await fetchJson('notices/'+noticeSelectedCat+'/index.json');
      if(reqId !== noticeReqId) return;
      await loadMoreNotices(reqId);
      if(noticeQuery) await loadAllNotices(reqId);
    }catch(e){
      if(reqId !== noticeReqId) return;
      noticeArea.innerHTML = '<div class="empty-state"><span class="es-icon">📢</span>공지사항을 불러오지 못했어요.<br>네트워크 상태를 확인하고 다시 시도해주세요.</div>';
    }
  }

  function renderNoticeDetail(d, sourceUrl){
    noticeDetailArea.innerHTML =
      '<p class="notice-detail-title">'+escapeHtml(d.title)+'</p>'+
      '<p class="notice-detail-meta">'+
        (d.writer? '<span>'+escapeHtml(d.writer)+'</span>':'')+
        (d.writeDate? '<span>'+escapeHtml(d.writeDate)+'</span>':'')+
        (d.hit? '<span>조회 '+escapeHtml(d.hit)+'</span>':'')+
      '</p>'+
      ((d.attachments||[]).length ? '<div class="attach-list">'+d.attachments.map(f=>
        '<a class="attach-item" href="'+escapeHtml(f.href)+'" target="_blank" rel="noopener">📎 '+escapeHtml(f.name)+'</a>'
      ).join('')+'</div>' : '')+
      '<div class="board-contents">'+(d.contentHtml || '본문을 불러올 수 없어요.')+'</div>'+
      '<div class="attach-list"><a class="attach-item" href="'+escapeHtml(sourceUrl)+'" target="_blank" rel="noopener">🔗 학교 홈페이지에서 원문 보기</a></div>';
  }

  async function openNoticeDetail(articleNo){
    noticeListView.style.display = 'none';
    noticeDetailView.style.display = '';
    noticeDetailArea.innerHTML = '<div class="notice-loading">불러오는 중이에요…</div>';
    window.scrollTo({top:0});
    const cat = currentNoticeCategory();
    const sourceUrl = cat.url+'?mode=view&articleNo='+encodeURIComponent(articleNo)+'&article.offset=0&articleLimit=10';
    try{
      await loadJsonSWR('notices/'+cat.key+'/'+encodeURIComponent(articleNo)+'.json', (d)=> renderNoticeDetail(d, d.sourceUrl || sourceUrl), false);
    }catch(e){
      // 아직 수집되지 않았거나 오래된 글 → 학교 홈페이지로 안내
      noticeDetailArea.innerHTML = '<div class="empty-state"><span class="es-icon">📢</span>본문이 아직 준비되지 않았어요.<br>잠시 후 다시 시도하거나 학교 홈페이지에서 확인해주세요.</div>'+
        '<div class="attach-list"><a class="attach-item" href="'+escapeHtml(sourceUrl)+'" target="_blank" rel="noopener">🔗 학교 홈페이지에서 원문 보기</a></div>';
    }
  }

  noticeBackBtn.addEventListener('click', ()=>{
    noticeDetailView.style.display = 'none';
    noticeListView.style.display = '';
  });

  // ===================== tab switching =====================
  const TAB_TITLES = {
    rooms:'강의실별 수업현황',
    menu:'오늘의 학식',
    bus:'교통정보',
    notice:'교내 공지'
  };
  const tabButtons = document.querySelectorAll('.tab-btn');
  const tabPanels = document.querySelectorAll('.tab-panel');
  const pageTitle = document.getElementById('pageTitle');

  function switchTab(name){
    tabButtons.forEach(b=> b.classList.toggle('active', b.getAttribute('data-tab')===name));
    tabPanels.forEach(p=> p.classList.toggle('active', p.getAttribute('data-tab')===name));
    pageTitle.textContent = TAB_TITLES[name] || '';
    window.scrollTo({top:0});
  }
  tabButtons.forEach(b=>{
    b.addEventListener('click', ()=> switchTab(b.getAttribute('data-tab')));
  });

  // ===================== 날씨 (Open-Meteo, 키 불필요) =====================
  // 구미시 거의동 부근 좌표
  const WEATHER_LAT = 36.1402, WEATHER_LON = 128.3978;
  const WEATHER_KEY = 'kumohWeather_v1';
  function weatherInfo(code){
    if(code===0) return ['☀️','맑음'];
    if(code<=2) return ['🌤️','구름조금'];
    if(code===3) return ['☁️','흐림'];
    if(code===45||code===48) return ['🌫️','안개'];
    if(code>=51&&code<=57) return ['🌦️','이슬비'];
    if(code>=61&&code<=67) return ['🌧️','비'];
    if(code>=71&&code<=77) return ['🌨️','눈'];
    if(code>=80&&code<=82) return ['🌧️','소나기'];
    if(code===85||code===86) return ['🌨️','눈'];
    if(code>=95) return ['⛈️','뇌우'];
    return ['⛅','—'];
  }
  function showWeather(w){
    const info = weatherInfo(w.code);
    document.getElementById('wIcon').textContent = info[0];
    document.getElementById('wTemp').textContent = Math.round(w.temp)+'°';
    document.getElementById('wDesc').textContent = '거의동 · '+info[1];
  }
  async function loadWeather(){
    try{
      const c = JSON.parse(localStorage.getItem(WEATHER_KEY) || 'null');
      if(c){ showWeather(c); if(Date.now()-c.at < 10*60*1000) return; }
    }catch(e){}
    try{
      const url = 'https://api.open-meteo.com/v1/forecast?latitude='+WEATHER_LAT+'&longitude='+WEATHER_LON+
        '&current=temperature_2m,weather_code&timezone=Asia%2FSeoul';
      const res = await fetch(url);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const j = await res.json();
      const w = { temp:j.current.temperature_2m, code:j.current.weather_code, at:Date.now() };
      showWeather(w);
      try{ localStorage.setItem(WEATHER_KEY, JSON.stringify(w)); }catch(e){}
    }catch(e){}
  }

  // ===================== 교통 (TAGO 버스도착정보, Actions가 bus.json 갱신) =====================
  // Cloudflare Worker 주소 (배포 후 https://이름.계정.workers.dev 로 교체). 비워 두면 GitHub 데이터만 사용.
  const BUS_API = 'https://1.kangdongwan7.workers.dev/';
  let busData = null;
  const busArea = document.getElementById('busArea');
  const busUpdated = document.getElementById('busUpdated');

  function renderBus(){
    if(!busData){ return; }
    const elapsedSec = Math.max(0, Math.round((Date.now() - new Date(busData.updatedAt).getTime())/1000));
    const ageMin = Math.floor(elapsedSec/60);
    busUpdated.textContent = (ageMin<1 ? '방금 전' : ageMin+'분 전')+' 기준 · 도착 시간은 경과 시간만큼 보정해서 보여줘요'+(elapsedSec>600 ? ' (오래된 정보예요. 새로고침을 눌러 주세요)' : '');

    if(!busData.groups || busData.groups.length===0){
      busArea.innerHTML = '<div class="empty-state"><span class="es-icon">🚌</span>'+escapeHtml(busData.message || '표시할 버스 정보가 없어요.')+'</div>';
      return;
    }
    busArea.innerHTML = busData.groups.map(g=>{
      const rows = (g.arrivals||[]).map(a=>{
        const left = a.sec - elapsedSec;
        let eta;
        if(elapsedSec > 600) eta = '<span class="br-eta" style="color:var(--ink-dim)">정보 오래됨</span>';
        else if(left <= 30) eta = '<span class="br-eta soon">곧 도착</span>';
        else { const m = Math.max(1, Math.round(left/60)); eta = '<span class="br-eta'+(m<=3?' soon':'')+'">'+m+'분 후</span>'; }
        return '<div class="bus-row"><span class="br-no">'+escapeHtml(a.routeNo)+'</span>'+
          '<span class="br-info">'+(a.stopsLeft!=null? a.stopsLeft+'정거장 전':'')+(a.routeType? ' · '+escapeHtml(a.routeType):'')+'</span>'+eta+'</div>';
      }).join('') || '<div class="bus-row"><span class="br-info">도착 예정 버스가 없어요.</span></div>';
      return '<div class="bus-stop"><p class="bs-title">'+escapeHtml(g.title)+'</p>'+
        '<p class="bs-sub">'+escapeHtml(g.stopName||'')+(g.stopNo? ' ('+escapeHtml(g.stopNo)+')':'')+'</p>'+rows+'</div>';
    }).join('');
  }

  async function loadBus(){
    busArea.innerHTML = busData ? busArea.innerHTML : '<div class="notice-loading">버스 정보를 불러오는 중이에요…</div>';
    try{
      let res = null;
      if(BUS_API){
        // Cloudflare Worker (30초 단위 갱신). 실패하면 아래 GitHub 데이터로 대체한다.
        try{ res = await fetch(BUS_API, { cache:'no-store' }); if(!res.ok) res = null; }catch(_){ res = null; }
      }
      if(!res){
        // 캐시를 피하려고 1분 단위 값을 붙인다.
        res = await fetch(DATA_BASE+'bus.json?t='+Math.floor(Date.now()/60000), { cache:'no-cache' });
        if(!res.ok) throw new Error('HTTP '+res.status);
      }
      busData = await res.json();
      renderBus();
    }catch(e){
      if(!busData) busArea.innerHTML = '<div class="empty-state"><span class="es-icon">🚌</span>교통 정보를 불러오지 못했어요.<br>잠시 후 다시 시도해주세요.</div>';
    }
  }
  document.getElementById('busRefreshBtn').addEventListener('click', loadBus);

  // ---- init ----
  loadWeather();
  loadBus();
  setInterval(loadWeather, 10*60*1000);
  setInterval(()=>{ if(document.visibilityState==='visible') loadBus(); }, 30*1000);
  setInterval(renderBus, 15*1000);
  renderStatus();
  renderFreeRooms();
  renderClock();
  initMenuDayRow();
  tryLoadMenu();
  initNoticeCatRow();
  tryLoadNotices();
  setInterval(()=>{ renderClock(); renderStatus(); renderFreeRooms(); }, 30000);

})();
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
</script>
<script>
  // 다크/라이트 전환
  (function(){
    const root = document.documentElement;
    const btn = document.getElementById('themeBtn');
    function paint(){
      const light = root.getAttribute('data-theme') === 'light';
      document.getElementById('themeIcon').textContent = light ? '☀️' : '🌙';
      document.getElementById('themeLabel').textContent = light ? '라이트' : '다크';
      const m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', light ? '#f5f5f7' : '#0b0b0c');
    }
    btn.addEventListener('click', ()=>{
      const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('kit-theme', next); } catch(e){}
      paint();
    });
    paint();
  })();
</script>
